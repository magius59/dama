<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACME Bus Services — Indagine BusTrack | Esercitazione Data Governance</title>
<style>
  :root {
    --blu-scuro: #1F3864;
    --blu-med: #2E74B5;
    --blu-chiaro: #BDD7EE;
    --arancio: #E8711A;
    --verde: #375623;
    --verde-ch: #E2EFDA;
    --rosso: #C00000;
    --rosso-ch: #FCE4D6;
    --giallo: #FFF2CC;
    --giallo-sc: #7F6000;
    --grigio-ch: #F2F2F2;
    --grigio-sc: #D9D9D9;
    --bianco: #ffffff;
    --testo: #1a1a2e;
    --testo-light: #4a4a6a;

    --raggio: 8px;
    --ombra: 0 2px 12px rgba(31,56,100,0.13);
    --ombra-hover: 0 4px 20px rgba(31,56,100,0.22);
    --trans: 0.18s ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f0f4f8;
    color: var(--testo);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    background: var(--blu-scuro);
    color: white;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .header-brand { font-size: 13px; opacity: 0.7; white-space: nowrap; }
  .header-title { font-size: 17px; font-weight: bold; text-align: center; flex: 1; }
  #progress-bar-wrap {
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  #progress-label { font-size: 12px; opacity: 0.75; }
  #progress-track {
    width: 100px; height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px; overflow: hidden;
  }
  #progress-fill {
    height: 100%; background: var(--arancio);
    border-radius: 3px; transition: width 0.4s ease;
    width: 0%;
  }

  /* ── SIDEBAR ── */
  .layout { display: flex; flex: 1; min-height: 0; }

  #sidebar {
    width: 240px; min-width: 200px; max-width: 260px;
    background: var(--bianco);
    border-right: 2px solid var(--grigio-sc);
    display: flex; flex-direction: column;
    overflow-y: auto;
  }

  .sidebar-section { padding: 14px; border-bottom: 1px solid var(--grigio-sc); }
  .sidebar-section h3 {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--testo-light);
    margin-bottom: 8px;
  }

  .role-pill {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 8px; border-radius: 5px;
    margin-bottom: 4px; font-size: 12px;
    cursor: pointer; transition: background var(--trans);
  }
  .role-pill:hover { background: var(--grigio-ch); }
  .role-badge {
    width: 32px; height: 20px; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: bold; color: white; flex-shrink: 0;
  }
  .rb-do  { background: var(--blu-scuro); }
  .rb-bds { background: var(--blu-med); }
  .rb-dc  { background: #375623; }
  .rb-dgc { background: #6B2D8B; }
  .rb-co  { background: #C55A11; }
  .rb-ub  { background: var(--arancio); }

  /* Tooltip modale ruolo */
  #role-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 999;
    align-items: center; justify-content: center;
  }
  #role-modal.show { display: flex; }
  .role-modal-box {
    background: white; border-radius: 10px;
    max-width: 480px; width: 90%; padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    position: relative;
  }
  .role-modal-box h2 { font-size: 18px; color: var(--blu-scuro); margin-bottom: 4px; }
  .role-modal-box .role-full { font-size: 13px; color: var(--testo-light); margin-bottom: 14px; }
  .role-modal-box p { font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
  .role-modal-box ul { padding-left: 18px; font-size: 13px; line-height: 1.7; color: var(--testo-light); }
  .modal-close {
    position: absolute; top: 12px; right: 16px;
    background: none; border: none; font-size: 22px;
    cursor: pointer; color: var(--testo-light);
    line-height: 1;
  }

  /* Cronologia */
  #storia { font-size: 12px; }
  .storia-item {
    padding: 5px 8px; border-left: 3px solid var(--grigio-sc);
    margin-bottom: 4px; cursor: pointer; border-radius: 0 4px 4px 0;
    transition: background var(--trans), border-color var(--trans);
  }
  .storia-item:hover { background: var(--grigio-ch); }
  .storia-item.ok { border-color: var(--verde); }
  .storia-item.err { border-color: var(--rosso); }
  .storia-item span { font-size: 10px; opacity: 0.6; display: block; margin-top: 1px; }

  /* ── MAIN ── */
  #main {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column;
    align-items: center; padding: 28px 24px 40px;
  }

  #scene-wrap { max-width: 760px; width: 100%; }

  /* Act label */
  .act-label {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--testo-light);
    margin-bottom: 8px;
  }

  /* Scene card */
  .scene-card {
    background: white; border-radius: var(--raggio);
    box-shadow: var(--ombra);
    padding: 28px 32px;
    margin-bottom: 20px;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .scene-card h2 {
    font-size: 20px; color: var(--blu-scuro);
    margin-bottom: 16px; line-height: 1.35;
    border-bottom: 2px solid var(--blu-chiaro);
    padding-bottom: 10px;
  }

  .scene-body { font-size: 15px; line-height: 1.75; color: var(--testo); }
  .scene-body p { margin-bottom: 12px; }
  .scene-body strong { color: var(--blu-scuro); }
  .scene-body em { color: var(--testo-light); font-style: italic; }

  /* Info box */
  .infobox {
    border-radius: var(--raggio); padding: 13px 16px;
    margin: 14px 0; font-size: 13.5px; line-height: 1.6;
  }
  .infobox.dati { background: var(--blu-chiaro); border-left: 4px solid var(--blu-med); }
  .infobox.warn { background: var(--giallo); border-left: 4px solid #BF8F00; }
  .infobox.err  { background: var(--rosso-ch); border-left: 4px solid var(--rosso); }
  .infobox.ok   { background: var(--verde-ch); border-left: 4px solid var(--verde); }
  .infobox.info { background: var(--grigio-ch); border-left: 4px solid var(--grigio-sc); }
  .infobox b { display: block; margin-bottom: 4px; }

  /* Choices */
  .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }

  .choice-btn {
    background: var(--bianco); border: 2px solid var(--blu-chiaro);
    border-radius: var(--raggio); padding: 14px 18px;
    text-align: left; cursor: pointer; font-size: 14px;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--testo); line-height: 1.5;
    transition: border-color var(--trans), background var(--trans), box-shadow var(--trans);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .choice-btn:hover {
    border-color: var(--blu-med); background: #f0f6ff;
    box-shadow: var(--ombra-hover);
  }
  .choice-btn .choice-letter {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--blu-med); color: white;
    font-size: 13px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .choice-btn .choice-text { flex: 1; }
  .choice-btn .choice-role {
    font-size: 11px; opacity: 0.6; display: block; margin-top: 2px;
  }

  /* Feedback overlay (wrong answer) */
  #feedback-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.55); z-index: 800;
    align-items: center; justify-content: center;
  }
  #feedback-overlay.show { display: flex; }
  .feedback-box {
    background: white; border-radius: 10px;
    max-width: 540px; width: 90%; padding: 28px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .feedback-box.wrong h3 { color: var(--rosso); margin-bottom: 12px; font-size: 16px; }
  .feedback-box.ok    h3 { color: var(--verde); margin-bottom: 12px; font-size: 16px; }
  .feedback-box p { font-size: 14px; line-height: 1.65; margin-bottom: 10px; }
  .feedback-box .consequence {
    background: var(--rosso-ch); border-radius: 6px;
    padding: 10px 14px; font-size: 13px; line-height: 1.6;
    margin-bottom: 14px; border-left: 4px solid var(--rosso);
  }
  .feedback-box .consequence.ok-con {
    background: var(--verde-ch); border-left-color: var(--verde);
  }
  .feedback-btn {
    background: var(--blu-scuro); color: white;
    border: none; border-radius: 6px; padding: 10px 20px;
    cursor: pointer; font-size: 14px; font-family: Arial, Helvetica, sans-serif;
    transition: background var(--trans);
  }
  .feedback-btn:hover { background: var(--blu-med); }

  /* Score banner */
  .score-banner {
    background: var(--blu-scuro); color: white;
    border-radius: var(--raggio); padding: 18px 24px;
    margin-bottom: 20px; display: flex; align-items: center; gap: 16px;
  }
  .score-num { font-size: 36px; font-weight: bold; color: var(--arancio); }
  .score-label { font-size: 13px; opacity: 0.8; }

  /* Final card */
  .final-card { text-align: center; }
  .final-card .finale-emoji { font-size: 52px; margin-bottom: 12px; }
  .final-card h2 { font-size: 22px; color: var(--blu-scuro); margin-bottom: 10px; }
  .final-card .raci-final {
    background: var(--grigio-ch); border-radius: 8px;
    padding: 16px; margin: 16px 0; text-align: left;
    font-size: 13px; line-height: 1.8;
  }
  .final-card .raci-final table { width: 100%; border-collapse: collapse; }
  .final-card .raci-final th {
    background: var(--blu-scuro); color: white;
    padding: 8px 10px; font-size: 12px; text-align: left;
  }
  .final-card .raci-final td {
    padding: 7px 10px; border-bottom: 1px solid var(--grigio-sc); font-size: 13px;
  }
  .final-card .raci-final tr:last-child td { border-bottom: none; }
  .final-card .raci-final td:nth-child(2) { font-weight: bold; color: var(--blu-scuro); }

  .restart-btn {
    background: var(--arancio); color: white;
    border: none; border-radius: 8px; padding: 13px 28px;
    font-size: 16px; font-family: Arial, Helvetica, sans-serif;
    cursor: pointer; margin-top: 16px;
    transition: background var(--trans), box-shadow var(--trans);
  }
  .restart-btn:hover { background: #c55e0d; box-shadow: 0 4px 14px rgba(232,113,26,0.35); }

  /* Responsive */
  @media (max-width: 700px) {
    #sidebar { display: none; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">ACME Bus Services · Data Governance</div>
  <div class="header-title">🔍 Indagine BusTrack — Chi chiami?</div>
  <div id="progress-bar-wrap">
    <span id="progress-label">Atto 1/3</span>
    <div id="progress-track"><div id="progress-fill"></div></div>
  </div>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-section">
      <h3>Ruoli — clicca per info</h3>
      <div class="role-pill" onclick="showRole('do')">
        <span class="role-badge rb-do">DO</span> Data Owner
      </div>
      <div class="role-pill" onclick="showRole('bds')">
        <span class="role-badge rb-bds">BDS</span> Business Data Steward
      </div>
      <div class="role-pill" onclick="showRole('dc')">
        <span class="role-badge rb-dc">DC</span> Data Custodian
      </div>
      <div class="role-pill" onclick="showRole('dgc')">
        <span class="role-badge rb-dgc">DGC</span> Data Gov. Council
      </div>
      <div class="role-pill" onclick="showRole('co')">
        <span class="role-badge rb-co">CO</span> Compliance
      </div>
      <div class="role-pill" onclick="showRole('ub')">
        <span class="role-badge rb-ub">UB</span> Utente Business
      </div>
    </div>
    <div class="sidebar-section">
      <h3>Cronologia scelte</h3>
      <div id="storia"></div>
    </div>
    <div class="sidebar-section">
      <h3>Punteggio</h3>
      <div style="font-size: 24px; font-weight: bold; color: var(--blu-scuro);" id="score-disp">0 pt</div>
      <div style="font-size: 11px; color: var(--testo-light); margin-top: 3px;">scelte corrette: <span id="correct-count">0</span> / <span id="total-count">0</span></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main">
    <div id="scene-wrap">
      <!-- Scenes rendered here by JS -->
    </div>
  </main>
</div>

<!-- ROLE MODAL -->
<div id="role-modal" onclick="closeRole(event)">
  <div class="role-modal-box" id="role-modal-box">
    <button class="modal-close" onclick="document.getElementById('role-modal').classList.remove('show')">×</button>
    <div id="role-modal-content"></div>
  </div>
</div>

<!-- FEEDBACK OVERLAY -->
<div id="feedback-overlay">
  <div class="feedback-box" id="feedback-box">
    <h3 id="feedback-title"></h3>
    <p id="feedback-text"></p>
    <div class="consequence" id="feedback-consequence"></div>
    <button class="feedback-btn" id="feedback-btn" onclick="closeFeedback()">Capito — continua</button>
  </div>
</div>

// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
let state = {
  current: 'start',
  score: 0,
  correct: 0,
  total: 0,
  history: []   // {scene_id, choice_text, correct}
};

// ═══════════════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════════════
function render() {
  const scene = SCENES[state.current];
  if (!scene) return;

  document.getElementById('progress-fill').style.width = (scene.progress || 0) + '%';
  document.getElementById('progress-label').textContent = scene.act || '';

  updateSidebar();

  if (scene.type === 'final') {
    renderFinal();
    return;
  }

  const wrap = document.getElementById('scene-wrap');
  const letters = 'ABCD';

  let html = `<div class="act-label">${scene.act}</div>
  <div class="scene-card">
    <h2>${scene.title}</h2>
    <div class="scene-body">${scene.body}</div>`;

  if (scene.choices && scene.choices.length) {
    html += `<div class="choices">`;
    scene.choices.forEach((c, i) => {
      const roleLabel = c.role ? `<span class="choice-role">Ruolo: ${c.role} — ${ROLES[c.role.toLowerCase()]?.nome || ''}</span>` : '';
      html += `<button class="choice-btn" onclick="choose(${i})">
        <span class="choice-letter">${letters[i]}</span>
        <span class="choice-text">${c.text}${roleLabel}</span>
      </button>`;
    });
    html += `</div>`;
  }

  html += `</div>`;
  wrap.innerHTML = html;
  wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderFinal() {
  const pct = state.total > 0 ? Math.round((state.correct / state.total) * 100) : 0;
  const emoji = pct >= 80 ? '🏆' : pct >= 50 ? '👍' : '📚';
  const verdict = pct >= 80
    ? 'Indagine completata con piena padronanza dei ruoli DG!'
    : pct >= 50
    ? 'Buona padronanza — qualche incertezza sui confini tra ruoli.'
    : 'Da rivedere: i ruoli DG hanno confini precisi che vale la pena approfondire.';

  const wrap = document.getElementById('scene-wrap');
  wrap.innerHTML = `
  <div class="scene-card final-card">
    <div class="finale-emoji">${emoji}</div>
    <h2>Indagine conclusa</h2>
    <p>${verdict}</p>

    <div class="score-banner">
      <div>
        <div class="score-num">${state.score} pt</div>
        <div class="score-label">punteggio finale</div>
      </div>
      <div>
        <div style="font-size:22px;font-weight:bold">${state.correct}/${state.total}</div>
        <div class="score-label">scelte corrette al primo tentativo</div>
      </div>
    </div>

    <div class="raci-final">
      <b style="font-size:14px;margin-bottom:10px;display:block">RACI dell\'indagine — versione corretta</b>
      <table>
        <tr>
          <th>Attività</th><th>A</th><th>R</th><th>C</th><th>I</th>
        </tr>
        <tr><td>Identificare la causa dell\'anomalia</td><td>DO</td><td>BDS</td><td>—</td><td>DC, CFO</td></tr>
        <tr><td>Proporre la nuova definizione di "ricavo"</td><td>DO</td><td>BDS</td><td>DGC</td><td>CO</td></tr>
        <tr><td>Arbitrare il conflitto cross-dominio</td><td>DGC</td><td>DGC</td><td>DO x2</td><td>CFO</td></tr>
        <tr><td>Fix tecnico deposito Napoli</td><td>DO</td><td>DC</td><td>BDS</td><td>—</td></tr>
        <tr><td>Comunicare il risultato al CDA</td><td>DO</td><td>DO</td><td>BDS, DC</td><td>CO</td></tr>
      </table>
    </div>

    <p style="font-size:13px;color:var(--testo-light);margin-top:10px">
      Guarda la cronologia delle tue scelte nella barra laterale sinistra per rivedere i punti critici.
    </p>
    <button class="restart-btn" onclick="restart()">🔄 Ricomincia l\'indagine</button>
  </div>`;
}

function updateSidebar() {
  document.getElementById('score-disp').textContent = state.score + ' pt';
  document.getElementById('correct-count').textContent = state.correct;
  document.getElementById('total-count').textContent = state.total;

  const el = document.getElementById('storia');
  el.innerHTML = state.history.map(h => `
    <div class="storia-item ${h.correct ? 'ok' : 'err'}" title="${h.choice}">
      ${h.correct ? '✓' : '✗'} ${h.scene}
      <span>${h.choice.substring(0, 38)}…</span>
    </div>`).join('') || '<div style="font-size:11px;color:var(--testo-light);padding:4px">Nessuna scelta ancora</div>';
}

// ═══════════════════════════════════════════════════════════════════════════
// CHOICE HANDLER
// ═══════════════════════════════════════════════════════════════════════════
function choose(idx) {
  const scene = SCENES[state.current];
  const choice = scene.choices[idx];
  state.total++;

  state.history.push({
    scene: scene.title,
    choice: choice.text,
    correct: choice.correct
  });

  if (choice.correct) {
    state.correct++;
    state.score += 10;
    state.current = choice.next;
    render();
  } else {
    showFeedback(choice);
  }

  updateSidebar();
}

function showFeedback(choice) {
  const overlay = document.getElementById('feedback-overlay');
  const box = document.getElementById('feedback-box');

  box.className = 'feedback-box wrong';
  document.getElementById('feedback-title').textContent = choice.feedback_title || '⚠ Scelta non ottimale';
  document.getElementById('feedback-text').textContent = choice.feedback_text || '';
  const con = document.getElementById('feedback-consequence');
  con.textContent = choice.feedback_consequence || '';
  con.className = 'consequence';

  overlay.classList.add('show');
}

function closeFeedback() {
  document.getElementById('feedback-overlay').classList.remove('show');
}

// ═══════════════════════════════════════════════════════════════════════════
// RUOLI MODAL
// ═══════════════════════════════════════════════════════════════════════════
function showRole(key) {
  const r = ROLES[key];
  if (!r) return;
  const el = document.getElementById('role-modal-content');
  el.innerHTML = `
    <h2><span class="role-badge ${r.colore}" style="display:inline-flex;margin-right:8px">${r.sigla}</span>${r.nome}</h2>
    <div class="role-full">${r.persona}</div>
    <p>${r.desc}</p>
    <p><strong>Cosa fa:</strong></p>
    <ul>${r.fa.map(f => `<li>${f}</li>`).join('')}</ul>
    <p style="margin-top:10px"><strong>Cosa NON fa:</strong></p>
    <ul>${r.nonFa.map(f => `<li>${f}</li>`).join('')}</ul>
    <p style="margin-top:10px;padding:10px;background:var(--grigio-ch);border-radius:6px;font-size:13px">
      <strong>Nel caso ACME:</strong><br>${r.acme}
    </p>`;
  document.getElementById('role-modal').classList.add('show');
}

function closeRole(e) {
  if (e.target === document.getElementById('role-modal'))
    document.getElementById('role-modal').classList.remove('show');
}

function restart() {
  state = { current: 'start', score: 0, correct: 0, total: 0, history: [] };
  render();
}

// ─── INIT ─────────────────────────────────────────────────────────────────
render();
</script>
