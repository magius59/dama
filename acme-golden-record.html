<script id="passages" type="application/json">{"Start": {"html": "\u003ch2>Il \u003cem>golden record\u003c/em> del cliente di ACME Bus Services\u003c/h2>\u003cp>\u003cstrong>Ruolo.\u003c/strong> Siamo il Business Data Steward del dominio commerciale di ACME Bus Services, compagnia di trasporto passeggeri su gomma. Applichiamo i contenuti del Modulo 9 (\u003cem>Master Data Management\u003c/em>) con attenzione ai metadati (\u003cem>metadata management\u003c/em>).\u003c/p>\u003cp>\u003cstrong>Situazione.\u003c/strong> Dopo una pulizia una tantum dell'anagrafica, i duplicati ricompaiono: i clienti entrano da tre canali non coordinati. Lo stesso viaggiatore risulta in tre sistemi:\u003c/p>\u003ctable>\u003ctr>\u003cth>Fonte\u003c/th>\u003cth>ID record\u003c/th>\u003cth>Nome\u003c/th>\u003cth>Indirizzo\u003c/th>\u003cth>Email\u003c/th>\u003cth>Telefono\u003c/th>\u003cth>Abbonamento\u003c/th>\u003cth>Ultima modifica\u003c/th>\u003c/tr>\u003ctr>\u003ctd>App mobile\u003c/td>\u003ctd>APP-20417\u003c/td>\u003ctd>M. Verdi\u003c/td>\u003ctd>Via Roma 10\u003c/td>\u003ctd>m.verdi@example.com\u003c/td>\u003ctd>(mancante)\u003c/td>\u003ctd>Attivo\u003c/td>\u003ctd>28/09/2026\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Biglietteria\u003c/td>\u003ctd>BIG-88231\u003c/td>\u003ctd>Mario V.\u003c/td>\u003ctd>Via Roma 10\u003c/td>\u003ctd>mverdi@example.org\u003c/td>\u003ctd>333 0000000\u003c/td>\u003ctd>(mancante)\u003c/td>\u003ctd>03/11/2025\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Portale abbonamenti\u003c/td>\u003ctd>POR-30572\u003c/td>\u003ctd>Verdi Mario\u003c/td>\u003ctd>v. Roma, 10\u003c/td>\u003ctd>(mancante)\u003c/td>\u003ctd>333 0000000\u003c/td>\u003ctd>Attivo, scad. dicembre\u003c/td>\u003ctd>14/06/2026\u003c/td>\u003c/tr>\u003c/table>\u003cp>\u003cstrong>Obiettivo.\u003c/strong> Costruire il \u003cem>golden record\u003c/em> con i metadati che lo accompagnano, definire il \u003cem>workflow\u003c/em> di validazione e compilare la voce di Business Glossary. Affrontiamo sei decisioni e ogni scelta corretta vale un punto. Le soglie e i valori numerici sono scelti a scopo didattico.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D1\">Iniziamo dalla prima decisione\u003c/a>\u003c/div>", "inc": false, "reset": true}, "D1": {"html": "\u003ch3>Decisione 1 di 6: quali metadati accompagnano il golden record?\u003c/h3>\u003cp>Prima di unire i record stabiliamo che cosa conserviamo, oltre ai valori degli attributi. Quale insieme scegliamo?\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D1A\">A. Soltanto gli attributi di business: nome, indirizzo, email, telefono, abbonamento\u003c/a>\u003ca class=\"opt\" href=\"#\" data-goto=\"D1B\">B. Gli attributi di business e, per ogni record: sistema e ID sorgente, data di ultimo aggiornamento per campo, regola di matching applicata con il punteggio, stato di validazione, Business Data Steward responsabile, versione\u003c/a>\u003ca class=\"opt\" href=\"#\" data-goto=\"D1C\">C. Nessun attributo aggiuntivo: i metadati stanno nella voce di Business Glossary\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D1A": {"html": "\u003cp>\u003cstrong>Scelta A: 0 punti.\u003c/strong> Senza metadati di origine non sappiamo da quale sistema proviene ciascun valore. Il customer care non riesce a ricostruire chi ha inserito un indirizzo errato, e la regola «vince il valore più recente» della decisione 3 non è applicabile perché manca la data per campo. L'insieme corretto è B: aggiunge ai valori dei metadati \u003cem>business\u003c/em>, \u003cem>technical\u003c/em> e \u003cem>operational\u003c/em>.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D2\">Proseguiamo\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D1B": {"html": "\u003cp>\u003cstrong>Scelta B: 1 punto.\u003c/strong> I metadati si classificano in tre famiglie:\u003c/p>\u003ctable>\u003ctr>\u003cth>Famiglia\u003c/th>\u003cth>Nel nostro golden record\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cem>Business\u003c/em>\u003c/td>\u003ctd>Business Data Steward responsabile; definizione e regole nel Business Glossary\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cem>Technical\u003c/em>\u003c/td>\u003ctd>Sistema e ID del record sorgente, che costituiscono il \u003cem>lineage\u003c/em> del record\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cem>Operational\u003c/em>\u003c/td>\u003ctd>Date di aggiornamento per campo, punteggio e regola di \u003cem>matching\u003c/em>, stato di validazione, versione\u003c/td>\u003c/tr>\u003c/table>\u003cp>Con queste tre famiglie ricostruiamo l'origine di ogni valore e possiamo applicare le regole delle decisioni seguenti.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D2\">Proseguiamo\u003c/a>\u003c/div>", "inc": true, "reset": false}, "D1C": {"html": "\u003cp>\u003cstrong>Scelta C: 0 punti.\u003c/strong> La voce di glossary descrive una sola volta il significato dell'entità e le sue regole. Origine, data e stato cambiano da record a record e vanno conservati insieme al singolo record. L'insieme corretto è B, che aggiunge ai valori dei metadati \u003cem>business\u003c/em>, \u003cem>technical\u003c/em> e \u003cem>operational\u003c/em>.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D2\">Proseguiamo\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D2": {"html": "\u003ch3>Decisione 2 di 6: come riconosciamo che tre record sono la stessa persona?\u003c/h3>\u003cp>Nella fase di \u003cem>entity resolution\u003c/em> serve una regola di \u003cem>matching\u003c/em>. Quale adottiamo?\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D2A\">A. Uguaglianza esatta del campo nome\u003c/a>\u003ca class=\"opt\" href=\"#\" data-goto=\"D2B\">B. Punteggio composto da somiglianza del nome, coincidenza dell'indirizzo ed email o telefono uguali. Da 90 in su unione automatica, da 60 a 89 coda di revisione, sotto 60 record distinti\u003c/a>\u003ca class=\"opt\" href=\"#\" data-goto=\"D2C\">C. Unione automatica quando cognome e indirizzo coincidono\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D2A": {"html": "\u003cp>\u003cstrong>Scelta A: 0 punti.\u003c/strong> I tre record riportano «M. Verdi», «Mario V.» e «Verdi Mario». Nessuna coincidenza esatta produce nessuna unione, e i duplicati restano. La regola corretta è B.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D3\">Proseguiamo\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D2B": {"html": "\u003cp>\u003cstrong>Scelta B: 1 punto.\u003c/strong> Sui nostri tre record il nome è simile, l'indirizzo coincide e il telefono è uguale tra biglietteria e portale: il punteggio didattico è 94, sopra la soglia di unione automatica. I tre record confluiscono in un unico \u003cem>golden record\u003c/em>. Regola applicata e punteggio entrano tra i metadati \u003cem>operational\u003c/em> della decisione 1.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D3\">Proseguiamo\u003c/a>\u003c/div>", "inc": true, "reset": false}, "D2C": {"html": "\u003cp>\u003cstrong>Scelta C: 0 punti.\u003c/strong> Con questa regola due persone distinte allo stesso civico, come padre e figlio, finirebbero nello stesso record. Un'unione errata si corregge con più fatica di un duplicato, perché si è già propagata ai sistemi collegati. La regola corretta è B.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D3\">Proseguiamo\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D3": {"html": "\u003ch3>Decisione 3 di 6: quale valore sopravvive nel consolidamento?\u003c/h3>\u003cp>Le due email sono diverse: quella dell'app mobile (aggiornata il 28/09/2026) e quella della biglietteria (modificata il 03/11/2025). Quale regola di \u003cem>survivorship\u003c/em> adottiamo per l'email?\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D3A\">A. Sopravvive il valore con la data di aggiornamento più recente\u003c/a>\u003ca class=\"opt\" href=\"#\" data-goto=\"D3B\">B. Sopravvive sempre il valore della biglietteria, il canale storico\u003c/a>\u003ca class=\"opt\" href=\"#\" data-goto=\"D3C\">C. Sopravvive il valore con più caratteri\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D3A": {"html": "\u003cp>\u003cstrong>Scelta A: 1 punto.\u003c/strong> Sopravvive l'email dell'app mobile. La regola è applicabile perché abbiamo conservato la data di aggiornamento per campo (decisione 1). Le regole di \u003cem>survivorship\u003c/em> si definiscono per attributo e si documentano come metadati di \u003cem>business\u003c/em>. Per l'abbonamento, per esempio, adottiamo la priorità di fonte: il portale abbonamenti è il sistema di riferimento di quell'attributo.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D4\">Proseguiamo\u003c/a>\u003c/div>", "inc": true, "reset": false}, "D3B": {"html": "\u003cp>\u003cstrong>Scelta B: 0 punti.\u003c/strong> Il golden record conserverebbe l'email del 2025 e le comunicazioni di rinnovo arriverebbero a un indirizzo non più valido. Il criterio corretto è A, la data di aggiornamento più recente.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D4\">Proseguiamo\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D3C": {"html": "\u003cp>\u003cstrong>Scelta C: 0 punti.\u003c/strong> Il criterio riguarda la forma del dato e può selezionare un valore obsoleto. Il criterio corretto è A, la data di aggiornamento più recente.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D4\">Proseguiamo\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D4": {"html": "\u003ch3>Decisione 4 di 6: come trattiamo un caso incerto?\u003c/h3>\u003cp>Arriva un nuovo record, APP-20990, «M. Verdi, Via Roma 10/A», con email assente e telefono diverso. Rispetto al golden record ottiene un punteggio di 78. Che cosa facciamo?\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D4A\">A. Unione automatica, perché 78 supera 60\u003c/a>\u003ca class=\"opt\" href=\"#\" data-goto=\"D4B\">B. Inseriamo il candidato nella coda del Business Data Steward, con le evidenze (campi coincidenti e diversi, punteggio, regola applicata) e stato «In revisione»\u003c/a>\u003ca class=\"opt\" href=\"#\" data-goto=\"D4C\">C. Scartiamo il candidato e manteniamo i record separati, senza registrare nulla\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D4A": {"html": "\u003cp>\u003cstrong>Scelta A: 0 punti.\u003c/strong> La soglia di unione automatica è 90. Il punteggio 78 rientra nella fascia incerta, tra 60 e 89, e il record potrebbe appartenere a un familiare allo stesso civico. La scelta corretta è B.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D5\">Proseguiamo\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D4B": {"html": "\u003cp>\u003cstrong>Scelta B: 1 punto.\u003c/strong> Il Business Data Steward decide con le evidenze a disposizione e la decisione viene registrata tra i metadati \u003cem>operational\u003c/em>. L'automazione propone e la persona decide nei casi dubbi.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D5\">Proseguiamo\u003c/a>\u003c/div>", "inc": true, "reset": false}, "D4C": {"html": "\u003cp>\u003cstrong>Scelta C: 0 punti.\u003c/strong> Se i due record erano la stessa persona, il duplicato resta. Senza traccia della valutazione, nessuno saprà che il confronto è già avvenuto. La scelta corretta è B.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D5\">Proseguiamo\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D5": {"html": "\u003ch3>Decisione 5 di 6: quale workflow governa le modifiche?\u003c/h3>\u003cp>Definiamo il \u003cem>workflow\u003c/em> di validazione del golden record. Quale scegliamo?\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D5A\">A. Pubblicazione immediata, validazione solo se emergono errori\u003c/a>\u003ca class=\"opt\" href=\"#\" data-goto=\"D5B\">B. Stati Bozza, In revisione, Approvato, Pubblicato. Ogni transizione registra chi, quando, motivo e valore precedente\u003c/a>\u003ca class=\"opt\" href=\"#\" data-goto=\"D5C\">C. Validazione solo su richiesta del customer care\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D5A": {"html": "\u003cp>\u003cstrong>Scelta A: 0 punti.\u003c/strong> Un valore errato raggiungerebbe tutti i sistemi collegati prima di essere controllato, e un dato master sbagliato si moltiplica. Il workflow corretto è B.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D6\">Proseguiamo\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D5B": {"html": "\u003cp>\u003cstrong>Scelta B: 1 punto.\u003c/strong> Ogni modifica ha un responsabile e una traccia (\u003cem>audit trail\u003c/em>), coerentemente con il principio di \u003cem>accountability\u003c/em>. L'\u003cem>audit trail\u003c/em> è un metadato \u003cem>operational\u003c/em> e supporta anche l'obbligo di esattezza dei dati personali (GDPR, art. 5, par. 1, lett. d).\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D6\">Proseguiamo\u003c/a>\u003c/div>", "inc": true, "reset": false}, "D5C": {"html": "\u003cp>\u003cstrong>Scelta C: 0 punti.\u003c/strong> Il controllo scatterebbe dopo l'errore. Il principio del modulo è prevenire alla porta d'ingresso. Il workflow corretto è B.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D6\">Proseguiamo\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D6": {"html": "\u003ch3>Decisione 6 di 6: chi risponde della definizione dell'entità master?\u003c/h3>\u003cp>Secondo la matrice RACI del Modulo 9, chi è Accountable della \u003cem>definizione dell'entità master Cliente e dei suoi attributi principali\u003c/em>?\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"D6A\">A. Data Engineer\u003c/a>\u003ca class=\"opt\" href=\"#\" data-goto=\"D6B\">B. Business Data Owner\u003c/a>\u003ca class=\"opt\" href=\"#\" data-goto=\"D6C\">C. IT Data Steward\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D6A": {"html": "\u003cp>\u003cstrong>Scelta A: 0 punti.\u003c/strong> Nella riga della matrice relativa a questa attività il Data Engineer non ha un ruolo assegnato. La risposta corretta è il Business Data Owner.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"Fine\">Vediamo il risultato\u003c/a>\u003c/div>", "inc": false, "reset": false}, "D6B": {"html": "\u003cp>\u003cstrong>Scelta B: 1 punto.\u003c/strong> Nella riga della matrice il Business Data Owner è Accountable e Consulted (A/C). Il Business Data Steward e il Data Architect sono Responsible (R).\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"Fine\">Vediamo il risultato\u003c/a>\u003c/div>", "inc": true, "reset": false}, "D6C": {"html": "\u003cp>\u003cstrong>Scelta C: 0 punti.\u003c/strong> L'IT Data Steward è Accountable dell'allineamento e dell'integrazione delle fonti dati esistenti, un'attività distinta dalla definizione dell'entità master. La risposta corretta è il Business Data Owner.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"Fine\">Vediamo il risultato\u003c/a>\u003c/div>", "inc": false, "reset": false}, "Fine": {"html": "\u003ch3>Risultato: \u003cspan data-punti>\u003c/span> su 6\u003c/h3>\u003cdiv data-min=\"6\" hidden>\u003cp>Percorso completo: tutte le decisioni coincidono con la soluzione di riferimento.\u003c/p>\u003c/div>\u003cdiv data-min=\"4\" hidden>\u003cp>Buona padronanza. Rivediamo le decisioni che hanno ottenuto 0 punti, rileggendo i paragrafi 9.4 e 9.5 del Modulo 9.\u003c/p>\u003c/div>\u003cdiv data-min=\"0\" hidden>\u003cp>Rileggiamo i paragrafi 9.2, 9.4 e 9.5 del Modulo 9 e rifacciamo il playbook.\u003c/p>\u003c/div>\u003cp>\u003cstrong>Voce di Business Glossary (soluzione di riferimento)\u003c/strong>\u003c/p>\u003ctable>\u003ctr>\u003cth>Campo\u003c/th>\u003cth>Contenuto\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Termine\u003c/td>\u003ctd>Golden Record Cliente\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Definizione\u003c/td>\u003ctd>Versione unica, autorevole e validata dell'anagrafica di un viaggiatore ACME, consolidata dai tre canali (app mobile, biglietteria, portale abbonamenti)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Regola di unicità\u003c/td>\u003ctd>Un solo golden record per cliente; i record di canale sono viste collegate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Regola di matching\u003c/td>\u003ctd>Punteggio composto: da 90 in su unione automatica, da 60 a 89 revisione del Business Data Steward, sotto 60 record distinti\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Regole di survivorship\u003c/td>\u003ctd>Email e telefono: valore con aggiornamento più recente. Abbonamento: priorità al portale abbonamenti\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Metadati business\u003c/td>\u003ctd>Business Data Owner del dominio commerciale; Business Data Steward responsabile\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Metadati technical\u003c/td>\u003ctd>Sistema e ID del record sorgente (lineage)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Metadati operational\u003c/td>\u003ctd>Data di aggiornamento per campo, punteggio e regola di matching, stato nel workflow, versione\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Workflow\u003c/td>\u003ctd>Bozza, In revisione, Approvato, Pubblicato; ogni transizione registra chi, quando, motivo e valore precedente\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Versione\u003c/td>\u003ctd>1.0\u003c/td>\u003c/tr>\u003c/table>\u003cp>\u003cstrong>Riferimenti.\u003c/strong> DAMA-DMBOK2: Cap. 10 (\u003cem>Reference and Master Data\u003c/em>) e Cap. 12 (\u003cem>Metadata Management\u003c/em>). La numerazione dei capitoli va verificata sulla propria copia. Regolamento UE 2016/679 (GDPR), art. 5, par. 1, lett. d.\u003c/p>\u003cdiv class=\"opts\">\u003ca class=\"opt\" href=\"#\" data-goto=\"Start\">Ricominciamo il playbook\u003c/a>\u003c/div>", "inc": false, "reset": false}}</script>
<script>
(function () {
  var P = JSON.parse(document.getElementById('passages').textContent);
  var story = document.getElementById('story');
  var punti = 0;

  function show(name) {
    var p = P[name];
    if (!p) return;
    if (p.reset) punti = 0;
    if (p.inc) punti += 1;
    story.innerHTML = p.html;
    var spans = story.querySelectorAll('[data-punti]');
    for (var i = 0; i < spans.length; i++) spans[i].textContent = punti;
    var blocks = story.querySelectorAll('[data-min]');
    for (var j = 0; j < blocks.length; j++) {
      if (punti >= Number(blocks[j].getAttribute('data-min'))) { blocks[j].hidden = false; break; }
    }
    window.scrollTo(0, 0);
    var h = story.querySelector('h2,h3');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
  }

  story.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-goto]');
    if (!a) return;
    e.preventDefault();
    show(a.getAttribute('data-goto'));
  });

  show('Start');
})();
</script>
</body>
</html>
